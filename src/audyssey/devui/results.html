<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Audyssey Results</title>
<style>body{margin:0;background:#101820;color:#e5edf4;font:15px system-ui}header{padding:20px;background:#1a2935;position:sticky;top:0;z-index:2}select,button{padding:9px;margin:4px;background:#293d4c;color:white;border:1px solid #527184;border-radius:6px}main{max-width:1200px;margin:auto;padding:20px}video{width:100%;max-height:380px;background:black}.row{display:grid;grid-template-columns:2fr 1fr;gap:20px;padding:16px;margin:12px 0;border:1px solid #385263;border-radius:10px}.selected{border-color:#48d6bc;background:#172f35}canvas{width:100%;height:100px;cursor:pointer}pre{white-space:pre-wrap}#seek{width:70%}@media(max-width:650px){.row{grid-template-columns:1fr}}</style>
<header><b>Audyssey Results</b> <select id="runs"></select><select id="jobs"></select><button id="refresh">새로고침</button><span id="status"></span></header>
<main><video id="video" muted playsinline></video><p><button id="play">▶ / ❚❚</button><input id="seek" type="range" min="0" max="1" step=".001" value="0"><span id="time"></span></p><div id="tracks"></div></main>
<script>
const $=id=>document.getElementById(id),v=$('video');let data=[],rows=[],selected=null,epoch=0;
const url=p=>'/api/file?path='+encodeURIComponent(p);
function option(el,text,value){let o=document.createElement('option');o.textContent=text;o.value=value;el.append(o)}
async function load(){try{data=await (await fetch('/api/results')).json();$('runs').replaceChildren();data.forEach((r,i)=>option($('runs'),r.name,i));chooseRun()}catch(e){$('status').textContent=String(e)}}
function chooseRun(){$('jobs').replaceChildren();(data[$('runs').value]?.jobs||[]).forEach((j,i)=>option($('jobs'),j.name,i));openJob()}
function select(row){if(selected===row)return;let playing=!v.paused;if(selected)selected.audio.pause();selected=row;rows.forEach(r=>r.el.classList.toggle('selected',r===row));row.audio.currentTime=Math.min(v.currentTime,row.audio.duration||v.currentTime);if(playing)row.audio.play().catch(()=>{});draw()}
function draw(){for(let r of rows){let c=r.canvas,ctx=c.getContext('2d');c.width=c.clientWidth*devicePixelRatio;c.height=100*devicePixelRatio;ctx.fillStyle='#48d6bc';let max=Math.max(.001,...r.peaks);r.peaks.forEach((p,i)=>{let h=p/max*c.height*.9;ctx.fillRect(i*c.width/r.peaks.length,(c.height-h)/2,Math.max(1,c.width/r.peaks.length),h)});ctx.fillStyle='#fff';ctx.fillRect(v.currentTime/(v.duration||1)*c.width,0,2,c.height)}}
async function openJob(){let token=++epoch;v.pause();rows.forEach(r=>r.audio.pause());rows=[];selected=null;$('tracks').replaceChildren();let entry=data[$('runs').value]?.jobs[$('jobs').value];if(!entry)return;if(entry.error){$('status').textContent=entry.error;return}$('status').textContent='';let j=entry.job,base=entry.key.slice(0,-8);v.src=url(base+j.video_path);let ts=[{name:'원본',path:j.audio_path},...(j.sources||[]).map(s=>({name:s.plan.name,path:s.track_path,caption:s.plan.description,filter:s.filter})),{name:'Residual',path:j.residual?.path}];for(let t of ts){let el=document.createElement('div');el.className='row';let left=document.createElement('div'),title=document.createElement('b'),canvas=document.createElement('canvas'),info=document.createElement('pre');title.textContent=t.name;info.textContent=[t.caption,t.filter?JSON.stringify(t.filter,null,2):'점수 없음'].filter(Boolean).join('\n');left.append(title,canvas);el.append(left,info);$('tracks').append(el);let audio=new Audio(t.path?url(base+t.path):''),r={el,canvas,audio,peaks:[]};rows.push(r);audio.onerror=()=>{title.textContent=t.name+' — 파일 없음 / 재생 불가'};canvas.onclick=e=>{select(r);v.currentTime=e.offsetX/canvas.clientWidth*(v.duration||0)};if(!t.path){title.textContent+=' — 파일 없음';continue}fetch('/api/peaks?path='+encodeURIComponent(base+t.path)).then(x=>{if(!x.ok)throw Error();return x.json()}).then(p=>{if(epoch===token){r.peaks=p;draw()}}).catch(()=>{if(epoch===token)title.textContent+=' — waveform 없음'});if(!selected)select(r)}}
v.onplay=()=>{if(selected){selected.audio.currentTime=v.currentTime;selected.audio.play().catch(()=>{})}};v.onpause=()=>selected?.audio.pause();v.onseeking=()=>{if(selected)selected.audio.currentTime=v.currentTime};v.ontimeupdate=()=>{if(selected&&Math.abs(selected.audio.currentTime-v.currentTime)>.2)selected.audio.currentTime=v.currentTime;$('seek').value=v.currentTime/(v.duration||1);$('time').textContent=v.currentTime.toFixed(1)+' / '+(v.duration||0).toFixed(1)+'s';draw()};$('play').onclick=()=>v.paused?v.play():v.pause();$('seek').oninput=e=>v.currentTime=e.target.value*(v.duration||0);$('runs').onchange=chooseRun;$('jobs').onchange=openJob;$('refresh').onclick=load;window.onresize=draw;load();
</script>
