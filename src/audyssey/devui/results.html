<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Audyssey Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111216;color:#e4e4eb;font:13px system-ui}button,select,input{accent-color:#a78bfa}button,select{background:#292a33;color:inherit;border:1px solid #42434f;border-radius:5px;padding:8px;cursor:pointer}button:disabled{opacity:.4;cursor:default}header{height:64px;display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid #333}header b{font-size:18px;margin-right:auto}.preview{display:grid;grid-template-columns:1fr 280px;gap:20px;padding:20px;height:42vh;min-height:260px}.screen{position:relative;min-width:0;min-height:0;background:#08090b;display:grid;place-items:center}video{width:100%;height:100%;object-fit:contain;position:absolute}#overlay{position:absolute;pointer-events:none}aside{background:#1b1c23;padding:20px;border-radius:8px;overflow:auto}aside h2{font-size:18px}small{color:#a4a5b6}pre{white-space:pre-wrap;font:12px system-ui}nav{padding:12px 20px;display:flex;gap:14px;align-items:center;background:#202129}#timeline{overflow:auto;height:calc(58vh - 120px);min-height:240px}.lane{display:flex;border-bottom:1px solid #32333c;min-height:100px}.label{width:220px;flex-shrink:0;padding:12px;background:#202129;position:sticky;left:0;z-index:2}.label b{display:block;margin-bottom:8px}.selected .label{border-left:3px solid #ad91ff;background:#30283f}.wave{height:100px;flex-shrink:0;position:relative}canvas{width:100%;height:100%;cursor:crosshair}.ruler{height:30px}#status{color:#eab89b}@media(max-width:700px){.preview{grid-template-columns:1fr;height:35vh}aside{display:none}.label{width:150px}header{flex-wrap:wrap;height:auto}}
</style>
<header><b>◈ Audyssey Studio</b><select id="runs" aria-label="실행"></select><select id="jobs" aria-label="영상"></select><button id="refresh">새로고침</button><span id="status"></span></header>
<section class="preview"><div class="screen"><video id="video" muted playsinline></video><canvas id="overlay"></canvas></div><aside><small>SELECTED TRACK</small><h2 id="caption">트랙 선택</h2><p id="ranges"></p><button id="box" disabled>박스 확인</button><pre id="details"></pre></aside></section>
<nav><button id="play">▶ / ❚❚</button><span id="time">0.00 / 0.00 s</span><small>트랙 선택 = 단독 청취 · 구간 = planning 추정</small><label>확대 <input id="zoom" type="range" min="1" max="8" step=".5" value="1"></label></nav><div id="timeline"></div>
<script>
const $=id=>document.getElementById(id),v=$('video');let data=[],rows=[],selected=null,epoch=0,duration=1,boxHint=null;
const url=p=>'/api/file?path='+encodeURIComponent(p);
function option(el,text,value){let o=new Option(text,value);el.add(o)}
async function load(){try{const r=await fetch('/api/results');if(!r.ok)throw Error('결과 조회 실패');data=await r.json();$('runs').replaceChildren();data.forEach((r,i)=>option($('runs'),r.name,i));chooseRun()}catch(e){$('status').textContent=e.message}}
function chooseRun(){$('jobs').replaceChildren();(data[$('runs').value]?.jobs||[]).forEach((j,i)=>option($('jobs'),j.name,i));openJob()}
function select(r){selected?.audio.pause();selected=r;rows.forEach(x=>x.el.classList.toggle('selected',x===r));$('caption').textContent=r.name;$('ranges').textContent=r.spans.map(s=>`${s.start}–${s.end} s`).join(', ')||'planning 구간 없음';$('box').disabled=!r.hint;$('details').textContent=[r.error,r.description,r.filter?JSON.stringify(r.filter,null,2):''].filter(Boolean).join('\n\n');sync();if(!v.paused)playAudio()}
function sync(){if(selected?.path){try{selected.audio.currentTime=v.currentTime}catch{}}}
function playAudio(){if(selected?.path)selected.audio.play().catch(e=>{$('status').textContent='오디오 재생 불가: '+e.message})}
function draw(){let width=Math.max(400,$('timeline').clientWidth-220)*Number($('zoom').value);for(const r of rows){r.wave.style.width=width+'px';let c=r.canvas,ctx=c.getContext('2d'),d=devicePixelRatio||1;c.width=width*d;c.height=100*d;ctx.scale(d,d);ctx.fillStyle='#191a21';ctx.fillRect(0,0,width,100);for(let t=0;t<=duration;t+=Math.max(1,Math.ceil(duration/20))){let x=t/duration*width;ctx.strokeStyle='#30313b';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,100);ctx.stroke();ctx.fillStyle='#9293a5';ctx.fillText(t+'s',x+3,12)}ctx.fillStyle='#aa88ef33';for(const s of r.spans){let a=Math.max(0,s.start),b=Math.min(duration,s.end);if(b<=a)continue;ctx.fillRect(a/duration*width,18,(b-a)/duration*width,82);ctx.fillStyle='#c5afff';ctx.fillText(`${s.start}–${s.end}s`,a/duration*width+4,28);ctx.fillStyle='#aa88ef33'}ctx.fillStyle=r===selected?'#b79aff':'#708ba9';let max=Math.max(.001,...r.peaks);r.peaks.forEach((p,i)=>{let h=p/max*58;ctx.fillRect(i*width/r.peaks.length,64-h/2,Math.max(1,width/r.peaks.length),h)});ctx.fillStyle='#f4c98c';ctx.fillRect(v.currentTime/duration*width,0,2,100)}drawBox()}
function drawBox(){let c=$('overlay'),ctx=c.getContext('2d');c.width=v.clientWidth;c.height=v.clientHeight;ctx.clearRect(0,0,c.width,c.height);if(!boxHint||!v.videoWidth)return;let scale=Math.min(c.width/v.videoWidth,c.height/v.videoHeight),w=v.videoWidth*scale,h=v.videoHeight*scale,x=(c.width-w)/2,y=(c.height-h)/2,[a,b,d,e]=boxHint.box;ctx.strokeStyle='#b79aff';ctx.lineWidth=3;ctx.strokeRect(x+a*w,y+b*h,(d-a)*w,(e-b)*h);ctx.fillStyle='#b79aff';ctx.fillText(selected.name,x+a*w+4,y+b*h+16)}
async function openJob(){const token=++epoch;v.pause();rows.forEach(r=>{r.audio.pause();r.audio.removeAttribute('src');r.audio.load()});rows=[];selected=null;boxHint=null;$('timeline').replaceChildren();$('box').disabled=true;$('caption').textContent='트랙 선택';$('details').textContent='';$('ranges').textContent='';$('status').textContent='';let entry=data[$('runs').value]?.jobs[$('jobs').value];if(!entry)return;if(entry.error){$('status').textContent=entry.error;return}let j=entry.job,base=entry.key.slice(0,-8);duration=j.duration||1;v.src=url(base+j.video_path);let ts=[{name:'원본',path:j.audio_path},...(j.sources||[]).map(s=>({name:s.plan.name,path:s.status==='failed'?null:s.track_path,spans:s.plan.spans,hint:s.plan.visual_hint,description:s.plan.description,filter:s.filter,error:s.status==='failed'?'분리 실패':''})),{name:'Residual',path:j.residual?.path}];for(const t of ts){let el=document.createElement('div'),label=document.createElement('div'),title=document.createElement('b'),wave=document.createElement('div'),canvas=document.createElement('canvas');el.className='lane';label.className='label';wave.className='wave';title.textContent=t.name;label.append(title);let btn=document.createElement('button');btn.textContent=t.path?'단독 청취':'파일 없음 / 실패';btn.disabled=!t.path;label.append(btn);wave.append(canvas);el.append(label,wave);$('timeline').append(el);let r={...t,spans:t.spans||[],el,wave,canvas,audio:new Audio(t.path?url(base+t.path):undefined),peaks:[]};rows.push(r);btn.onclick=()=>select(r);label.onclick=()=>select(r);canvas.onclick=e=>{boxHint=null;select(r);v.currentTime=e.offsetX/canvas.clientWidth*duration;draw()};if(t.path){r.audio.onerror=()=>{if(token===epoch){btn.textContent='재생 불가';btn.disabled=true}};fetch('/api/peaks?path='+encodeURIComponent(base+t.path)).then(x=>{if(!x.ok)throw Error();return x.json()}).then(p=>{if(epoch===token){r.peaks=p;draw()}}).catch(()=>{if(epoch===token)title.textContent+=' · 파형 없음'})}if(!selected&&t.path)select(r)}draw()}
$('box').onclick=()=>{if(!selected?.hint)return;v.pause();boxHint=null;v.currentTime=selected.hint.time;const hint=selected.hint;v.addEventListener('seeked',()=>{if(selected?.hint===hint){boxHint=hint;drawBox()}},{once:true})};v.onplay=()=>{boxHint=null;drawBox();playAudio()};v.onpause=()=>selected?.audio.pause();v.onseeking=()=>{boxHint=null;sync();drawBox()};v.onended=()=>selected?.audio.pause();v.ontimeupdate=()=>{if(selected?.path&&Math.abs(selected.audio.currentTime-v.currentTime)>.2)sync();$('time').textContent=`${v.currentTime.toFixed(2)} / ${duration.toFixed(2)} s`;draw()};$('play').onclick=()=>v.paused?v.play().catch(e=>$('status').textContent=e.message):v.pause();$('zoom').oninput=draw;$('runs').onchange=chooseRun;$('jobs').onchange=openJob;$('refresh').onclick=load;window.onresize=draw;load();
</script></html>
